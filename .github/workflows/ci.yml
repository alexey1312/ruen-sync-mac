name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_GITHUB_ATTESTATIONS: false

jobs:
  lint:
    name: Format + Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check (Swift + Markdown)
        run: mise run format-check

      - name: SwiftLint (strict)
        run: mise run lint

  test:
    name: Build + Test
    runs-on: macos-26
    needs: lint
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.2.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          tuist version

      - name: Generate Xcode project
        run: mise run generate

      - name: Build (debug)
        run: mise run build

      - name: Run unit tests
        run: mise run test
