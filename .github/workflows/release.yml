name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_GITHUB_ATTESTATIONS: false

jobs:
  release:
    name: Build, sign & publish
    runs-on: macos-26
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.2.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      # Sync MARKETING_VERSION + CURRENT_PROJECT_VERSION in Project.swift to
      # the tag. Repo-committed value is just a dev default; the tag is the
      # source of truth for what ships in Info.plist.
      - name: Inject version into Project.swift
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /"MARKETING_VERSION":/ {
              sub(/"MARKETING_VERSION": "[^"]+"/, "\"MARKETING_VERSION\": \"" v "\"")
            }
            /"CURRENT_PROJECT_VERSION":/ {
              sub(/"CURRENT_PROJECT_VERSION": "[^"]+"/, "\"CURRENT_PROJECT_VERSION\": \"" v "\"")
            }
            { print }
          ' Project.swift > Project.swift.tmp
          mv Project.swift.tmp Project.swift
          echo "Synced Project.swift to ${VERSION}:"
          grep -E '"(MARKETING|CURRENT_PROJECT)_VERSION":' Project.swift

      - name: Generate Xcode project
        run: mise run generate

      - name: Build Release
        run: mise run build:release

      # ----------------------------------------------------------------------
      # Codesign + notarize — only if secrets are present. Otherwise we ship
      # an ad-hoc signed .app (works locally; first-launch Gatekeeper prompt).
      # ----------------------------------------------------------------------
      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign + notarize + DMG
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
          DEV_ID_APP: ${{ secrets.DEV_ID_APP }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Pre-store notarytool credentials so notarize.sh's keychain-profile
          # lookup finds them.
          xcrun notarytool store-credentials NOTARY \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD"
          export NOTARY_PROFILE=NOTARY
          bash Scripts/notarize.sh

      # ----------------------------------------------------------------------
      # Unsigned fallback path — re-sign the bundle ad-hoc, then DMG it.
      #
      # Without re-signing, embedded frameworks (Sparkle) keep their original
      # signature. macOS dyld then refuses to load them because the process
      # and the framework have different Team IDs ("mapping process and
      # mapped file have different Team IDs"). The fix is a `--deep` ad-hoc
      # re-sign that overwrites every nested signature with one matching the
      # main executable's ad-hoc identity.
      # ----------------------------------------------------------------------
      - name: Package DMG (unsigned fallback)
        if: ${{ env.HAS_SIGNING != 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -name 'RuEnSync.app' -path '*/Release/*' -type d | head -1)"
          echo "→ Re-signing ${APP_PATH} ad-hoc (deep)"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose=2 "$APP_PATH"
          mkdir -p build/dist
          hdiutil create -volname "RuEnSync" -srcfolder "$APP_PATH" -ov -format UDZO "build/dist/RuEnSync.dmg"
          echo "Built unsigned DMG (ad-hoc re-signed; no Developer ID configured)"

      - name: Compute DMG SHA256
        id: sha
        run: |
          DMG_SHA="$(shasum -a 256 build/dist/RuEnSync.dmg | awk '{print $1}')"
          echo "dmg_sha=${DMG_SHA}" >> "$GITHUB_OUTPUT"
          echo "DMG SHA256: ${DMG_SHA}"

      # ----------------------------------------------------------------------
      # Sparkle: sign DMG with EdDSA + regenerate appcast.xml + publish.
      # Only runs when SPARKLE_PRIVATE_KEY is configured. Until then, the
      # release ships without an appcast entry — existing installs won't
      # auto-update for this version, but the DMG remains usable manually.
      # ----------------------------------------------------------------------
      - name: Sign DMG and regenerate appcast
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' && 'true' || 'false' }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          SPARKLE_VERSION: "2.6.4"
        run: |
          set -euo pipefail
          # Download just the Sparkle tools (sign_update, generate_appcast).
          # The .framework that ships in the .app is built separately by SPM
          # — this tarball is only for the CLI binaries.
          curl -sSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xJf sparkle.tar.xz -C sparkle-tools
          SPARKLE_BIN="$(pwd)/sparkle-tools/bin"

          # Write the EdDSA private key to a tmp file for sign_update.
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT

          # Stage the DMG in a clean folder; generate_appcast walks the dir.
          mkdir -p appcast-work
          cp build/dist/RuEnSync.dmg appcast-work/

          # Pull the current appcast so generate_appcast preserves history.
          # 404 on first run is fine — appcast-work will just have one item.
          curl -sSL --fail \
            "https://alexey1312.github.io/${REPO##*/}/appcast.xml" \
            -o appcast-work/appcast.xml || rm -f appcast-work/appcast.xml

          "$SPARKLE_BIN/generate_appcast" appcast-work \
            --ed-key-file "$KEYFILE" \
            --download-url-prefix "https://github.com/${REPO}/releases/download/v${VERSION}/" \
            --link "https://github.com/${REPO}"

          echo "Generated appcast.xml:"
          cat appcast-work/appcast.xml

      - name: Publish appcast to gh-pages
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' && 'true' || 'false' }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Clone the gh-pages branch via the workflow's built-in token.
          # Requires the branch to exist (setup is one-off — see README).
          git clone --branch gh-pages \
            "https://x-access-token:${PAGES_TOKEN}@github.com/${REPO}.git" \
            pages
          cp appcast-work/appcast.xml pages/appcast.xml
          cd pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast unchanged — skipping push"
          else
            git commit -m "appcast: ${VERSION}"
            git push
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuEnSync-${{ steps.version.outputs.version }}
          path: build/dist/RuEnSync.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/RuEnSync.dmg
          generate_release_notes: true
          body: |
            Built from tag ${{ github.ref_name }}.

            SHA256: `${{ steps.sha.outputs.dmg_sha }}`

            ## Install

            ```bash
            brew install --cask alexey1312/tap/ruensync
            ```

            Or download the DMG below and drag RuEnSync.app to ~/Applications.

      # ----------------------------------------------------------------------
      # Bump the Cask formula in alexey1312/homebrew-tap.
      # Requires HOMEBREW_TAP_TOKEN (PAT with `repo` scope on the tap repo).
      # If absent, this step is skipped.
      # ----------------------------------------------------------------------
      - name: Update Homebrew cask
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' && 'true' || 'false' }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_SHA: ${{ steps.sha.outputs.dmg_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/alexey1312/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/ruensync.rb <<RUBY
          cask "ruensync" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/${REPO}/releases/download/v#{version}/RuEnSync.dmg"
            name "RuEnSync"
            desc "Menubar app that keeps a QMK keyboard's cur_lang in sync with the macOS input source"
            homepage "https://github.com/${REPO}"

            app "RuEnSync.app"

            zap trash: [
              "~/.config/RuEnSync",
              "~/Library/Application Scripts/com.alexey1312.ruensync",
              "~/Library/Containers/com.alexey1312.ruensync",
            ]
          end
          RUBY
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ruensync.rb
          git commit -m "ruensync: bump to ${VERSION}"
          git push
